provenance:
  physical_source: Copied from RTS24_PCM_fullfunc_case/Data_RTS24_PCM_full
  physical_source_description: Modified RTS24 benchmark with synthetic annual profiles
  case_boundary: No PCM output or external PCM case path is read at runtime
  evaluation_window: Source hour 4235, selected for available-generation margin
  initial_state_source: Explicit warmed DART state; two quick-start units are offline
  load_derivation: Each bus peak MW is multiplied by its regional factor
  real_time_derivation: Three native 288-row five-minute files cover the 24-hour evaluation horizon
  quick_start_assumption: RTS24-G025 through RTS24-G030 are 30-minute quick-start hydro units with Flag_UC set to 1
  generator_dart_attributes: Quick-start, transition, no-load, shutdown, capability, and offer fields are merged into gendata.csv
  storage_reserve_assumption: Explicit reserve capabilities and offers are merged into storagedata.csv
  no_load_cost_assumption: Zero because the physical source has no no-load-cost column
  shutdown_cost_assumption: Zero because the physical source has no shutdown-cost column
  startup_shutdown_limit_assumption: Nameplate Pmax where source transition limits are absent
  emergency_rating_assumption: Normal branch ratings are reused as emergency ratings
  availability_treatment: Explicit physical outage; generic FOR derating is disabled
  contingency_scope: Strict generator N-1 for RTS24-G009 on the intact network
  interchange_assumption: Balanced 5 MW injection at RTS24-B001 and withdrawal at RTS24-B024
  terminal_storage_policy: End-of-lookahead SOC equals explicit initial SOC
