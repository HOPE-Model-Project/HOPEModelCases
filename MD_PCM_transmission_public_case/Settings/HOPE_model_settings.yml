DataCase: Data_MD_PCM_transmission_public/  # Self-contained input folder under this case directory
model_mode: PCM                            # Production-cost/dispatch model
holistic_spatial_basis: bus                # Validate paired GTEP topology at transmission-bus resolution
resource_aggregation: 0                    # Keep generator-level fleet detail
endogenous_rep_day: 0                      # Run the native 168-hour chronology
flexible_demand: 0                         # Demand response is not used in this baseline
clean_energy_policy: 0                     # Policy constraints disabled for network validation
carbon_policy: 0                           # Carbon constraint disabled for network validation
operation_reserve_mode: 0                  # Reserve constraints deferred until the network baseline is validated
network_model: 2                           # Nodal angle-based DCOPF
transmission_loss: 0                       # Lossless first benchmark; OSM does not provide validated resistance
reference_bus: 1                           # First retained bus is the angle reference
inv_dcs_bin: 0                             # No investment variables in PCM
time_periods:
    1 : (3, 20, 6, 20)
    2 : (6, 21, 9, 21)
    3 : (9, 22, 12, 20)
    4 : (12, 21, 3, 19)
unit_commitment: 0                         # LP dispatch baseline for initial physical-network validation
write_shadow_prices: 0                     # Enable later when price analysis is required
summary_table: 1                           # Write summary tables for validation
solver: highs                              # Open-source solver supplied by the HOPE environment
debug: 0                                   # Standard solve
